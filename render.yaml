# Render Blueprint — GSMHub (frontend + backend on free tier)
#
# Deploy: push this repo to GitHub, then in the Render dashboard:
#   New → Blueprint → pick the repo → Render reads this file.
# Render assigns each web service the URL https://<name>.onrender.com —
# the cross-references below assume those exact service names, so if a
# name is taken (Render appends a hash), update the URLs to match.
#
# Secrets marked `sync: false` are prompted for at apply time — paste:
#   MONGO_URI  — the Atlas URI; include a db name segment (…mongodb.net/gsmhub?…)
#                or Mongo falls back to the `test` database.
#   JWT_SECRET — the same value used locally (backend/.env).
#
# Redis is intentionally not provisioned: redis.config.ts fails soft
# (throwOnConnectError: false), so the API runs in cache-degraded mode
# without it. To add caching later, create a free Upstash Redis and set
# REDIS_URI (rediss://…) in the dashboard — no code change needed.

services:
  # --- NestJS API -------------------------------------------------------
  - type: web
    name: gsmhub-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start:prod
    healthCheckPath: /devices
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # CORS allow-list for the API — must equal the frontend's public URL.
      - key: FRONTEND_URL
        value: https://gsmhub-web.onrender.com

  # --- Next.js frontend ---------------------------------------------------
  - type: web
    name: gsmhub-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: NODE_ENV
        value: production
      # Must be set BEFORE the frontend build: Next bakes the /api rewrite
      # target into the routes manifest at build time.
      - key: BACKEND_URL
        value: https://gsmhub-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://gsmhub-web.onrender.com
      # phonedb.net serves an incomplete TLS chain; without this the image
      # optimizer rejects every device photo (UNABLE_TO_VERIFY_LEAF_SIGNATURE).
      # Path = repo-root certs/ dir; the repo is checked out at
      # /opt/render/project/src regardless of rootDir.
      - key: NODE_EXTRA_CA_CERTS
        value: /opt/render/project/src/certs/rapidssl-g1.pem
